# Local v3 stack. Production adds docker-compose.prod.yml as an override.

x-v3-image: &v3-image
  image: lsp-indexer-v3:local
  build:
    context: ..
    dockerfile: docker/Dockerfile

x-indexer-source-runtime: &indexer-source-runtime
  NODE_ENV: production
  INDEXER_SOURCE_RETRIES: ${INDEXER_SOURCE_RETRIES:-2}
  INDEXER_SOURCE_STALL_TIMEOUT_MS: ${INDEXER_SOURCE_STALL_TIMEOUT_MS:-30000}
  INDEXER_SOURCE_MAX_LAG_BLOCKS: ${INDEXER_SOURCE_MAX_LAG_BLOCKS:-10}
  INDEXER_SOURCE_ALL_DOWN_TIMEOUT_MS: ${INDEXER_SOURCE_ALL_DOWN_TIMEOUT_MS:-300000}

x-database-runtime: &database-runtime
  NODE_ENV: production
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-10000}
  DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-60000}
  DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-10000}
  DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
  DATABASE_UNFINALIZED_BLOCKS_RETENTION: ${DATABASE_UNFINALIZED_BLOCKS_RETENTION:-1000}

x-metadata-runtime: &metadata-runtime
  METADATA_CONCURRENCY: ${METADATA_CONCURRENCY:-8}
  METADATA_POLL_INTERVAL_MS: ${METADATA_POLL_INTERVAL_MS:-1000}
  METADATA_REQUEST_TIMEOUT_MS: ${METADATA_REQUEST_TIMEOUT_MS:-15000}
  METADATA_MAX_RESPONSE_BYTES: ${METADATA_MAX_RESPONSE_BYTES:-2097152}
  METADATA_MAX_REDIRECTS: ${METADATA_MAX_REDIRECTS:-3}
  METADATA_MAX_ATTEMPTS: ${METADATA_MAX_ATTEMPTS:-6}
  METADATA_RETRY_BASE_MS: ${METADATA_RETRY_BASE_MS:-5000}
  METADATA_RETRY_MAX_MS: ${METADATA_RETRY_MAX_MS:-1800000}
  METADATA_LEASE_TIMEOUT_MS: ${METADATA_LEASE_TIMEOUT_MS:-300000}
  METADATA_ALLOW_HTTP: ${METADATA_ALLOW_HTTP:-false}

x-runtime-dependencies: &runtime-dependencies
  migration:
    condition: service_completed_successfully

x-v3-healthcheck: &v3-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

x-v3-logging: &v3-logging
  driver: json-file
  options:
    max-size: 100m
    max-file: '10'
    compress: 'true'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_wal_size=2GB
      - -c
      - shared_buffers=512MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - work_mem=32MB
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lsp_indexer_v3}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    logging: *v3-logging

  database-logins:
    image: postgres:17-alpine
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/init-v3-logins.sh:/usr/local/bin/init-v3-logins:ro
    entrypoint: [/usr/local/bin/init-v3-logins]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lsp_indexer_v3}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_RUNTIME_LOGIN_LUKSO_MAINNET: ${DATABASE_RUNTIME_LOGIN_LUKSO_MAINNET:-lsp_v3_lukso_mainnet}
      DATABASE_RUNTIME_PASSWORD_LUKSO_MAINNET: ${DATABASE_RUNTIME_PASSWORD_LUKSO_MAINNET:-lukso-local}
      DATABASE_RUNTIME_LOGIN_ETHEREUM_MAINNET: ${DATABASE_RUNTIME_LOGIN_ETHEREUM_MAINNET:-lsp_v3_ethereum_mainnet}
      DATABASE_RUNTIME_PASSWORD_ETHEREUM_MAINNET: ${DATABASE_RUNTIME_PASSWORD_ETHEREUM_MAINNET:-ethereum-local}
      DATABASE_RUNTIME_LOGIN_ETHEREUM_SEPOLIA: ${DATABASE_RUNTIME_LOGIN_ETHEREUM_SEPOLIA:-lsp_v3_ethereum_sepolia}
      DATABASE_RUNTIME_PASSWORD_ETHEREUM_SEPOLIA: ${DATABASE_RUNTIME_PASSWORD_ETHEREUM_SEPOLIA:-sepolia-local}
      DATABASE_MIGRATION_NETWORKS: ${DATABASE_MIGRATION_NETWORKS:-lukso-mainnet,ethereum-mainnet}
      DATABASE_API_LOGIN: ${DATABASE_API_LOGIN:-lsp_v3_hasura}
      DATABASE_API_PASSWORD: ${DATABASE_API_PASSWORD:-hasura-local}
    logging: *v3-logging

  migration:
    <<: *v3-image
    restart: 'no'
    command: migrate
    depends_on:
      database-logins:
        condition: service_completed_successfully
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lsp_indexer_v3}
      DATABASE_MIGRATION_NETWORKS: ${DATABASE_MIGRATION_NETWORKS:-lukso-mainnet,ethereum-mainnet}
      DATABASE_RUNTIME_LOGIN_LUKSO_MAINNET: ${DATABASE_RUNTIME_LOGIN_LUKSO_MAINNET:-lsp_v3_lukso_mainnet}
      DATABASE_RUNTIME_LOGIN_ETHEREUM_MAINNET: ${DATABASE_RUNTIME_LOGIN_ETHEREUM_MAINNET:-lsp_v3_ethereum_mainnet}
      DATABASE_RUNTIME_LOGIN_ETHEREUM_SEPOLIA: ${DATABASE_RUNTIME_LOGIN_ETHEREUM_SEPOLIA:-lsp_v3_ethereum_sepolia}
      DATABASE_API_LOGIN: ${DATABASE_API_LOGIN:-lsp_v3_hasura}
    logging: *v3-logging

  indexer-lukso:
    <<: *v3-image
    restart: on-failure
    command: indexer
    depends_on: *runtime-dependencies
    environment:
      <<: [*indexer-source-runtime, *database-runtime]
      INDEXER_NETWORK: lukso-mainnet
      INDEXER_SOURCE_MODE: ${INDEXER_SOURCE_MODE_LUKSO_MAINNET:-fallback}
      INDEXER_RPC_RATE_LIMIT: ${INDEXER_RPC_RATE_LIMIT_LUKSO_MAINNET:-10}
      INDEXER_FROM_BLOCK: ${INDEXER_FROM_BLOCK_LUKSO_MAINNET:-0}
      INDEXER_TO_BLOCK: ${INDEXER_TO_BLOCK_LUKSO_MAINNET:-}
      INDEXER_METRICS_PORT: 9090
      SQD_PORTAL_URL: ${SQD_PORTAL_URL_LUKSO_MAINNET:-https://portal.sqd.dev/datasets/lukso-mainnet}
      RPC_URL_LUKSO_MAINNET: ${RPC_URL_LUKSO_MAINNET:-https://rpc.mainnet.lukso.network}
      DATABASE_URL: postgresql://${DATABASE_RUNTIME_LOGIN_LUKSO_MAINNET:-lsp_v3_lukso_mainnet}:${DATABASE_RUNTIME_PASSWORD_LUKSO_MAINNET:-lukso-local}@postgres:5432/${POSTGRES_DB:-lsp_indexer_v3}
    healthcheck:
      <<: *v3-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    logging: *v3-logging

  metadata-lukso:
    <<: *v3-image
    restart: unless-stopped
    command: metadata
    depends_on: *runtime-dependencies
    environment:
      <<: [*database-runtime, *metadata-runtime]
      INDEXER_NETWORK: lukso-mainnet
      METADATA_METRICS_PORT: 9091
      METADATA_IPFS_GATEWAYS: ${METADATA_IPFS_GATEWAYS_LUKSO_MAINNET:-https://api.universalprofile.cloud/ipfs/}
      DATABASE_URL: postgresql://${DATABASE_RUNTIME_LOGIN_LUKSO_MAINNET:-lsp_v3_lukso_mainnet}:${DATABASE_RUNTIME_PASSWORD_LUKSO_MAINNET:-lukso-local}@postgres:5432/${POSTGRES_DB:-lsp_indexer_v3}
    healthcheck:
      <<: *v3-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    logging: *v3-logging

  indexer-ethereum:
    <<: *v3-image
    restart: on-failure
    command: indexer
    depends_on: *runtime-dependencies
    environment:
      <<: [*indexer-source-runtime, *database-runtime]
      INDEXER_NETWORK: ethereum-mainnet
      INDEXER_SOURCE_MODE: ${INDEXER_SOURCE_MODE_ETHEREUM_MAINNET:-fallback}
      INDEXER_RPC_RATE_LIMIT: ${INDEXER_RPC_RATE_LIMIT_ETHEREUM_MAINNET:-10}
      INDEXER_FROM_BLOCK: ${INDEXER_FROM_BLOCK_ETHEREUM_MAINNET:-0}
      INDEXER_TO_BLOCK: ${INDEXER_TO_BLOCK_ETHEREUM_MAINNET:-}
      INDEXER_METRICS_PORT: 9090
      SQD_PORTAL_URL: ${SQD_PORTAL_URL_ETHEREUM_MAINNET:-https://portal.sqd.dev/datasets/ethereum-mainnet}
      RPC_URL_ETHEREUM_MAINNET: ${RPC_URL_ETHEREUM_MAINNET:-https://ethereum-rpc.publicnode.com}
      DATABASE_URL: postgresql://${DATABASE_RUNTIME_LOGIN_ETHEREUM_MAINNET:-lsp_v3_ethereum_mainnet}:${DATABASE_RUNTIME_PASSWORD_ETHEREUM_MAINNET:-ethereum-local}@postgres:5432/${POSTGRES_DB:-lsp_indexer_v3}
    healthcheck:
      <<: *v3-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    logging: *v3-logging

  metadata-ethereum:
    <<: *v3-image
    restart: unless-stopped
    command: metadata
    depends_on: *runtime-dependencies
    environment:
      <<: [*database-runtime, *metadata-runtime]
      INDEXER_NETWORK: ethereum-mainnet
      METADATA_METRICS_PORT: 9091
      METADATA_IPFS_GATEWAYS: ${METADATA_IPFS_GATEWAYS_ETHEREUM_MAINNET:-https://ipfs.io/ipfs/}
      DATABASE_URL: postgresql://${DATABASE_RUNTIME_LOGIN_ETHEREUM_MAINNET:-lsp_v3_ethereum_mainnet}:${DATABASE_RUNTIME_PASSWORD_ETHEREUM_MAINNET:-ethereum-local}@postgres:5432/${POSTGRES_DB:-lsp_indexer_v3}
    healthcheck:
      <<: *v3-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    logging: *v3-logging

  hasura:
    image: hasura/graphql-engine:v2.46.0
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/healthz]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    ports:
      - ${HASURA_GRAPHQL_PORT:-8080}:8080
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lsp_indexer_v3}
      HASURA_GRAPHQL_V3_DATABASE_URL: postgresql://${DATABASE_API_LOGIN:-lsp_v3_hasura}:${DATABASE_API_PASSWORD:-hasura-local}@postgres:5432/${POSTGRES_DB:-lsp_indexer_v3}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-hasura-local}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE:-true}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: ${HASURA_GRAPHQL_ENABLED_LOG_TYPES:-startup,http-log,webhook-log,websocket-log,query-log}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: ${HASURA_GRAPHQL_UNAUTHORIZED_ROLE:-public}
      HASURA_GRAPHQL_ENABLE_TELEMETRY: 'false'
    logging: *v3-logging

  hasura-apply:
    <<: *v3-image
    restart: 'no'
    command: hasura-apply
    depends_on:
      hasura:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ENDPOINT: http://hasura:8080
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-hasura-local}
    logging: *v3-logging

  loki:
    image: grafana/loki:3.4
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki-data:/loki
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
    logging: *v3-logging

  prometheus:
    image: prom/prometheus:v3.2.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=14d
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    logging: *v3-logging

  alloy:
    image: grafana/alloy:v1.14.0
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
      - prometheus
      - indexer-lukso
      - metadata-lukso
      - indexer-ethereum
      - metadata-ethereum
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *v3-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    restart: unless-stopped
    privileged: true
    command: --housekeeping_interval=30s --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    logging: *v3-logging

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../charts/lsp-indexer/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    logging: *v3-logging

volumes:
  postgres-data:
  grafana-data:
  loki-data:
  prometheus-data:
