# Production override. Always combine this file with docker-compose.yml.

x-v3-production-image: &v3-production-image
  image: ghcr.io/chillwhales/lsp-indexer:${INDEXER_VERSION:?Pin INDEXER_VERSION to an immutable v3 image tag}
  build: !reset null

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  database-logins:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_RUNTIME_PASSWORD_LUKSO_MAINNET: ${DATABASE_RUNTIME_PASSWORD_LUKSO_MAINNET:?Set DATABASE_RUNTIME_PASSWORD_LUKSO_MAINNET}
      DATABASE_RUNTIME_PASSWORD_ETHEREUM_MAINNET: ${DATABASE_RUNTIME_PASSWORD_ETHEREUM_MAINNET:?Set DATABASE_RUNTIME_PASSWORD_ETHEREUM_MAINNET}
      DATABASE_RUNTIME_PASSWORD_ETHEREUM_SEPOLIA: ${DATABASE_RUNTIME_PASSWORD_ETHEREUM_SEPOLIA:-}
      DATABASE_API_PASSWORD: ${DATABASE_API_PASSWORD:?Set DATABASE_API_PASSWORD}

  migration:
    <<: *v3-production-image

  indexer-lukso:
    <<: *v3-production-image
    restart: unless-stopped
    environment:
      INDEXER_TO_BLOCK: !reset null
      RPC_URL_LUKSO_MAINNET: ${RPC_URL_LUKSO_MAINNET:?Set RPC_URL_LUKSO_MAINNET}

  metadata-lukso:
    <<: *v3-production-image

  indexer-ethereum:
    <<: *v3-production-image
    restart: unless-stopped
    environment:
      INDEXER_TO_BLOCK: !reset null
      RPC_URL_ETHEREUM_MAINNET: ${RPC_URL_ETHEREUM_MAINNET:?Set RPC_URL_ETHEREUM_MAINNET}

  metadata-ethereum:
    <<: *v3-production-image

  hasura:
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Set HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'false'
      HASURA_GRAPHQL_DEV_MODE: 'false'

  hasura-apply:
    <<: *v3-production-image
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Set HASURA_GRAPHQL_ADMIN_SECRET}

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
