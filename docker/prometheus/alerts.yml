groups:
  - name: lsp-indexer-v3.availability
    rules:
      - alert: LspIndexerV3MetricsMissing
        expr: absent(up{component="indexer", deployment_network="lukso-mainnet"}) or absent(up{component="metadata-worker", deployment_network="lukso-mainnet"}) or absent(up{component="indexer", deployment_network="ethereum-mainnet"}) or absent(up{component="metadata-worker", deployment_network="ethereum-mainnet"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: LSP Indexer v3 metrics target disappeared
          description: The {{ $labels.component }} target for {{ $labels.deployment_network }} has been absent for five minutes.
      - alert: LspIndexerV3ProcessDown
        expr: up{component=~"indexer|metadata-worker"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: LSP Indexer v3 process is down
          description: No {{ $labels.component }} scrape has succeeded for {{ $labels.deployment_network }} in five minutes.
      - alert: LspIndexerV3DatabaseUnavailable
        expr: lsp_indexer_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: LSP Indexer v3 cannot read committed database state
          description: Database reads for {{ $labels.network }} have failed for two minutes.
      - alert: LspIndexerV3SourceUnavailable
        expr: sqd_fallback_chain_stalled == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: All configured indexer sources are stalled
          description: Fallback stream {{ $labels.id }} has observed every source stalled for five minutes.
  - name: lsp-indexer-v3.freshness
    rules:
      - alert: LspIndexerV3CommitLagHigh
        expr: lsp_indexer_block_to_commit_lag_seconds > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LSP Indexer v3 commit lag exceeds its budget
          description: '{{ $labels.network }} has remained {{ $value | humanizeDuration }} behind wall clock.'
      - alert: LspIndexerV3CursorDrift
        expr: lsp_indexer_cursor_drift_blocks > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Pipes cursor and committed projection head differ
          description: '{{ $labels.network }} has a durable cursor drift of {{ $value }} blocks.'
      - alert: LspIndexerV3SourceSwitching
        expr: delta(sqd_fallback_switches[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LSP Indexer v3 sources are flapping
          description: Fallback stream {{ $labels.id }} switched sources more than three times in 15 minutes.
      - alert: LspIndexerV3MetadataBacklogOld
        expr: lsp_indexer_metadata_oldest_age_seconds{status=~"pending|retry"} > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LSP Indexer v3 metadata backlog is stale
          description: 'The oldest {{ $labels.status }} job for {{ $labels.network }} is {{ $value | humanizeDuration }} old.'
