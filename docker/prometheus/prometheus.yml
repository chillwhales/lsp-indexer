# ==============================================================================
# Prometheus Configuration — Minimal
# ==============================================================================
#
# Metrics received via remote write from Alloy (--web.enable-remote-write-receiver flag in compose)
#
# Alloy handles scraping and pushes samples via remote write. Prometheus evaluates
# the same v3 alert rules used by the Helm deployment.
#
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs: []
