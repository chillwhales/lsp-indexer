{{- if and .Values.monitoring.enabled .Values.indexer.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lsp-indexer.fullname" . }}-v3
  labels:
    {{- include "lsp-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      {{- include "lsp-indexer.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [indexer, metadata-worker]
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_lsp_indexer_network]
          targetLabel: deployment_network
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: component
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "lsp-indexer.fullname" . }}-v3
  labels:
    {{- include "lsp-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: lsp-indexer-v3.availability
      rules:
        {{- range $network := .Values.indexer.networks }}
        {{- if $network.enabled }}
        - alert: LspIndexerV3MetricsMissing
          expr: absent(up{component="indexer", deployment_network={{ $network.key | quote }}}) or absent(up{component="metadata-worker", deployment_network={{ $network.key | quote }}})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LSP Indexer v3 metrics target disappeared"
            description: "The {{`{{ $labels.component }}`}} target for {{`{{ $labels.deployment_network }}`}} has been absent for five minutes."
        {{- end }}
        {{- end }}
        - alert: LspIndexerV3ProcessDown
          expr: up{component=~"indexer|metadata-worker"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LSP Indexer v3 {{`{{ $labels.component }}`}} is down"
            description: "No metrics scrape has succeeded for {{`{{ $labels.deployment_network }}`}} in five minutes."
        - alert: LspIndexerV3DatabaseUnavailable
          expr: lsp_indexer_database_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "LSP Indexer v3 cannot read committed database state"
            description: "Database reads for {{`{{ $labels.network }}`}} have failed for two minutes."
        - alert: LspIndexerV3CommittedHeadMissing
          expr: (lsp_indexer_database_up == 1) unless on (network, chain_id) lsp_indexer_indexed_block
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LSP Indexer v3 has no committed head"
            description: "{{`{{ $labels.network }}`}} can read PostgreSQL but has not exposed a committed indexed head for five minutes."
        - alert: LspIndexerV3SourceUnavailable
          expr: sqd_fallback_chain_stalled == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "All configured indexer sources are stalled"
            description: "Fallback stream {{`{{ $labels.id }}`}} has observed every source stalled for five minutes."
    - name: lsp-indexer-v3.freshness
      rules:
        - alert: LspIndexerV3CommitLagHigh
          expr: lsp_indexer_block_to_commit_lag_seconds > {{ .Values.monitoring.alerts.lagSeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LSP Indexer v3 commit lag exceeds its budget"
            description: "{{`{{ $labels.network }}`}} has remained {{`{{ $value | humanizeDuration }}`}} behind wall clock."
        - alert: LspIndexerV3CursorDrift
          expr: lsp_indexer_cursor_drift_blocks > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pipes cursor and committed projection head differ"
            description: "{{`{{ $labels.network }}`}} has a durable cursor drift of {{`{{ $value }}`}} blocks."
        - alert: LspIndexerV3SourceSwitching
          expr: delta(sqd_fallback_switches[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LSP Indexer v3 sources are flapping"
            description: "Fallback stream {{`{{ $labels.id }}`}} switched sources more than three times in 15 minutes."
        - alert: LspIndexerV3MetadataBacklogOld
          expr: lsp_indexer_metadata_oldest_age_seconds{status=~"pending|retry"} > {{ .Values.monitoring.alerts.metadataOldestAgeSeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LSP Indexer v3 metadata backlog is stale"
            description: "The oldest {{`{{ $labels.status }}`}} job for {{`{{ $labels.network }}`}} is {{`{{ $value | humanizeDuration }}`}} old."
{{- end }}
{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lsp-indexer.fullname" . }}-v3-dashboard
  labels:
    {{- include "lsp-indexer.labels" . | nindent 4 }}
    {{ .Values.monitoring.dashboard.label }}: {{ .Values.monitoring.dashboard.labelValue | quote }}
    app.kubernetes.io/component: monitoring
data:
  lsp-indexer-v3.json: |-
{{ .Files.Get "dashboards/v3-overview.json" | indent 4 }}
{{- end }}
