{{- if .Values.indexer.enabled }}
{{- range $network := .Values.indexer.networks }}
{{- if $network.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lsp-indexer.fullname" $ }}-indexer-{{ $network.key }}
  labels:
    {{- include "lsp-indexer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: indexer
    lsp-indexer.network: {{ $network.key | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lsp-indexer.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: indexer
      lsp-indexer.network: {{ $network.key | quote }}
  template:
    metadata:
      labels:
        {{- include "lsp-indexer.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: indexer
        lsp-indexer.network: {{ $network.key | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: database-readiness
          image: "{{ $.Values.indexer.image.repository }}:{{ $.Values.indexer.image.tag }}"
          imagePullPolicy: {{ $.Values.indexer.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              until /app/entrypoint.sh check-database; do
                echo "Waiting for the v3 migration and network role"
                sleep 5
              done
          env:
            - name: INDEXER_NETWORK
              value: {{ $network.key | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: {{ $network.databaseSecretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: indexer
          image: "{{ $.Values.indexer.image.repository }}:{{ $.Values.indexer.image.tag }}"
          imagePullPolicy: {{ $.Values.indexer.image.pullPolicy }}
          args: [indexer]
          ports:
            - name: metrics
              containerPort: {{ $network.metricsPort }}
          env:
            - name: INDEXER_NETWORK
              value: {{ $network.key | quote }}
            - name: INDEXER_SOURCE_MODE
              value: {{ $network.sourceMode | quote }}
            - name: INDEXER_FROM_BLOCK
              value: {{ $network.fromBlock | quote }}
            - name: INDEXER_METRICS_PORT
              value: {{ $network.metricsPort | quote }}
            - name: INDEXER_RPC_RATE_LIMIT
              value: {{ $network.rpcRateLimit | quote }}
            - name: INDEXER_SOURCE_RETRIES
              value: {{ $.Values.indexer.source.retries | quote }}
            - name: INDEXER_SOURCE_STALL_TIMEOUT_MS
              value: {{ $.Values.indexer.source.stallTimeoutMs | quote }}
            - name: INDEXER_SOURCE_MAX_LAG_BLOCKS
              value: {{ $.Values.indexer.source.maxLagBlocks | quote }}
            - name: INDEXER_SOURCE_ALL_DOWN_TIMEOUT_MS
              value: {{ $.Values.indexer.source.allDownTimeoutMs | quote }}
            - name: SQD_PORTAL_URL
              value: {{ $network.portalUrl | quote }}
            - name: RPC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: {{ $network.rpcSecretKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: {{ $network.databaseSecretKey }}
            - name: DATABASE_POOL_MAX
              value: {{ $.Values.indexer.database.poolMax | quote }}
            - name: DATABASE_STATEMENT_TIMEOUT_MS
              value: {{ $.Values.indexer.database.statementTimeoutMs | quote }}
            - name: DATABASE_LOCK_TIMEOUT_MS
              value: {{ $.Values.indexer.database.lockTimeoutMs | quote }}
            - name: DATABASE_UNFINALIZED_BLOCKS_RETENTION
              value: {{ $.Values.indexer.database.unfinalizedBlocksRetention | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml $.Values.indexer.indexerResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lsp-indexer.fullname" $ }}-indexer-{{ $network.key }}
  labels:
    {{- include "lsp-indexer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: indexer
    lsp-indexer.network: {{ $network.key | quote }}
spec:
  selector:
    {{- include "lsp-indexer.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: indexer
    lsp-indexer.network: {{ $network.key | quote }}
  ports:
    - name: metrics
      port: {{ $network.metricsPort }}
      targetPort: metrics
---
